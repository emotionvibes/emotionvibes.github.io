const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>/^https:\/\//.test(s||'')?esc(s):'';
function render(lang='ru',page='',detail='',offline=false){const t=site[lang],r=lang==='ru';const url=(p='',d='',l=lang)=>offline?`#/${l}/${p}${d?'/'+d:''}`:`/${l}/${p}${p?'/':''}${d?d+'/':''}`;const card=(title,body,link,tag='')=>`<article class="card"><span class="eyebrow">${esc(tag)}</span><h3>${esc(title)}</h3><p>${esc(body)}</p>${link?`<a class="text-link" href="${link}">${t.read} ↗</a>`:''}</article>`;const photo=src=>src?`<img class="portrait" src="${esc(src)}" alt="EmotionVibes"/>`:`<div class="portrait placeholder"><span>${t.photo}</span></div>`;let body='';
if(!page)body=`<section class="ev-hero"><div class="ev-hero-copy"><span class="eyebrow">EMOTIONVIBES · ${r?'СИЯНИЕ ЕДИНСТВА':'VIENYBĖS SPINDESYS'}</span><h1>${r?'Пространство, где встречаются Сердце и Осознанность':'Erdvė, kurioje susitinka Širdis ir Sąmoningumas'}</h1><p class="ev-lead">${r?'Тантры, активные медитации Ошо, авторские практики и индивидуальные встречи.':'Tantros, aktyvios Ošo meditacijos, autorinės praktikos ir individualūs susitikimai.'}</p><a class="ev-inline-link" href="${url('meditations')}">${r?'ПОЗНАКОМИТЬСЯ С ПРАКТИКАМИ':'ATRASKITE PRAKTIKAS'} <span aria-hidden="true">↗</span></a></div><div class="ev-hero-art" aria-hidden="true"><div class="ev-light"></div><div class="ev-ring"></div></div><aside class="ev-hero-side"><span>${r?'ТЕЛО':'KŪNAS'}</span><span>${r?'ДЫХАНИЕ':'KVĖPAVIMAS'}</span><span>${r?'ПРИСУТСТВИЕ':'BUVIMAS'}</span><span>${r?'СЕРДЦЕ':'ŠIRDIS'}</span><span>${r?'ГАРМОНИЯ':'HARMONIJA'}</span><a class="ev-round" href="${url('questions')}">${r?'ВОПРОСЫ И ОТВЕТЫ':'KLAUSIMAI IR ATSAKYMAI'} ↗</a></aside></section><section class="ev-section ev-pale"><div class="ev-heading"><h2>${r?'ПУТИ К СЕБЕ':'KELIAI Į SAVE'}</h2><p>${r?'Разные пути к внимательному и живому присутствию. Выберите то, что откликается вашему Сердцу.':'Skirtingi keliai į sąmoningą buvimą. Pasirinkite tai, kas atliepia jūsų Širdį.'}</p></div><div class="ev-directions">${[{name:r?'ТАНТРЫ':'TANTROS',note:r?'Практики присутствия и встречи с собой':'Buvimo ir susitikimo su savimi praktikos',to:'meditations'}, {name:r?'МЕДИТАЦИИ ОШО':'OŠO MEDITACIJOS',note:r?'Движение, дыхание, тишина':'Judesys, kvėpavimas, tyla',to:'meditations'}, {name:r?'ИНДИВИДУАЛЬНО':'INDIVIDUALIAI',note:r?'Внимание вашему пути':'Dėmesys jūsų keliui',to:'services'}, {name:r?'МУЗЫКА':'MUZIKA',note:r?'Авторские композиции':'Autorinės kompozicijos',to:'music'}, {name:r?'ВОПРОСЫ И ОТВЕТЫ':'KLAUSIMAI IR ATSAKYMAI',note:r?'Библиотека осознанности':'Sąmoningumo biblioteka',to:'questions'}].map((x,i)=>`<a class="ev-direction ev-direction-${i+1}" href="${url(x.to)}"><span class="ev-no">0${i+1}</span><h3>${x.name}</h3><p>${x.note}</p><span class="ev-arrow">↗</span></a>`).join('')}</div></section><section class="ev-manifest"><div class="ev-manifest-art" aria-hidden="true"></div><div class="ev-manifest-text"><span class="eyebrow">EMOTIONVIBES</span><h2>${r?'БОЛЬШЕ, ЧЕМ МЕДИТАЦИЯ':'DAUGIAU NEI MEDITACIJA'}</h2><p>${r?'Здесь не нужно становиться кем-то другим. Здесь можно встретиться с тем, кто ты есть.':'Čia nereikia tapti kažkuo kitu. Čia galima susitikti su tuo, kas esi.'}</p><a class="ev-inline-link" href="${url('about')}">${r?'ОБ EMOTIONVIBES':'APIE EMOTIONVIBES'} ↗</a></div><blockquote>${r?'«Гармония начинается внутри и меняет всё вокруг».':'„Harmonija prasideda viduje ir keičia tai, kas aplink.“'}</blockquote></section><section class="ev-section ev-pale"><div class="ev-heading"><h2>${r?'ВОПРОСЫ, КОТОРЫЕ ВЕДУТ К СЕБЕ':'KLAUSIMAI, VEDANTYS Į SAVE'}</h2><a class="ev-inline-link" href="${url('questions')}">${r?'ВСЕ ВОПРОСЫ И ОТВЕТЫ':'VISI KLAUSIMAI IR ATSAKYMAI'} ↗</a></div><div class="ev-feature-questions">${qs.slice(0,3).map((x,i)=>`<a href="${url('questions',x.slug)}"><span class="ev-no">0${i+1}</span><h3>${esc(x[lang].title)}</h3><span class="ev-arrow">↗</span></a>`).join('')}</div><p>${r?'Ваш вопрос увидит только автор. Ответ появится в библиотеке лишь после её решения опубликовать обезличенный текст.':'Jūsų klausimą matys tik autorė. Atsakymas bibliotekoje atsiras tik jai nusprendus paskelbti nuasmenintą tekstą.'}</p><a class="ev-inline-link" href="${url('questions')}">${r?'ЗАДАТЬ ВОПРОС':'UŽDUOTI KLAUSIMĄ'} ↗</a></section>`;
else if(page==='about')body=`<div class="split">${photo(settings.aboutPhoto)}<div><h2>EmotionVibes</h2><p class="intro">${t.about}</p><blockquote>${t.intro}</blockquote></div></div>`;
else if(page==='meditations')body=`<p class="intro">${t.intro}</p><div class="cards">${meds.map((x,i)=>`<div>${x.image?`<img class="med-image" src="${esc(x.image)}" alt="${esc(x[lang].title)}"/>`:''}${card(x[lang].title,x[lang].body+(x.duration?' · '+x.duration:''),safe(x.url),String(i+1).padStart(2,'0'))}</div>`).join('')}</div>`;
else if(page==='services')body=`<div class="cards">${t.services.map(x=>card(x,t.prices,url('contacts'))).join('')}</div>`;
else if((page==='questions'||page==='thoughts')&&detail){const x=(page==='questions'?qs:thoughts).find(x=>x.slug===detail);body=x?`<article class="reading"><span class="eyebrow">${x.demo?t.sample+' · ':''}${page==='questions'?cats[lang][x.category]:esc(x.date)}</span><h2>${esc(x[lang].title)}</h2><p>${esc(x[lang].body)}</p><button class="button" id="share">${t.share}</button><a class="text-link" href="${url(page)}">${page==='questions'?t.back:t.nav[5]}</a></article>`:'';}
else if(page==='questions')body=`<p class="intro">${r?'Не обязательно знать все ответы. Иногда достаточно найти свой вопрос.':'Nebūtina žinoti visų atsakymų. Kartais pakanka atrasti savo klausimą.'}</p><div class="filters"><input type="search" id="search" aria-label="${t.search}" placeholder="${t.search}"/><select id="category" aria-label="${t.all}"><option value="">${t.all}</option>${cats[lang].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></div><div class="cards">${qs.map(x=>`<div data-category="${x.category}" data-search="${esc((x[lang].title+' '+x[lang].body).toLocaleLowerCase(lang))}">${card(x[lang].title,x[lang].body,url(page,x.slug),(x.demo?t.sample+' · ':'')+cats[lang][x.category])}</div>`).join('')}</div><p id="empty" hidden>${t.none}</p><aside class="callout"><h2>${t.ask}</h2><p>${t.askInfo}</p>${safe(settings.telegram)?`<a class="button" href="${safe(settings.telegram)}" rel="noopener noreferrer" target="_blank">Telegram ↗</a>`:''}</aside>`;
else if(page==='thoughts')body=`<div class="cards">${thoughts.map(x=>card(x[lang].title,x[lang].body,url(page,x.slug),(x.demo?t.sample+' · ':'')+x.date)).join('')}</div>`;
else if(page==='music')body=`<p class="intro">${t.musicIntro}</p><h2>${t.latest}</h2><div class="chips">${t.musicCats.slice(1).map(x=>`<span>${x}</span>`).join('')}</div>${music.length?`<div class="cards">${[...music].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<article class="card"><span class="eyebrow">${esc(x.category)} · ${esc(x.date)}</span><h3>${esc(x[lang].title)}</h3><p>${esc(x[lang].body)}</p>${safe(x.playlistUrl)?`<a class="text-link" href="${safe(x.playlistUrl)}" target="_blank" rel="noopener noreferrer">${t.musicCats[3]} ↗</a>`:''}${/^[\w-]{11}$/.test(x.videoId||'')?`<div class="video"><p>${t.privacyText}</p><button class="button load-video" data-video="${esc(x.videoId)}">${t.play}</button></div>`:''}</article>`).join('')}</div>`:`<div class="music-empty"><span aria-hidden="true">♪</span><p>${t.emptyMusic}</p></div>`}`;
else if(page==='contacts')body=`<div class="reading"><p class="intro">${t.contactEmpty}</p>${['telegram','youtube'].map(k=>safe(settings[k])?`<a class="button" href="${safe(settings[k])}" target="_blank" rel="noopener noreferrer">${k==='telegram'?'Telegram':'YouTube'} ↗</a>`:'').join('')}</div>`;
else if(page==='privacy')body=`<div class="reading"><p>${t.privacyText}</p><button class="button" id="disable-video">${t.disable}</button></div>`;
const title=page==='privacy'?t.privacy:t.nav[slugs.indexOf(page)]||'EmotionVibes';return `<a class="skip" href="#content">${r?'К содержимому':'Į turinį'}</a><header><a class="brand" href="${url()}">${settings.logoDark?`<img src="${esc(settings.logoDark)}" alt="EmotionVibes"/>`:'EmotionVibes'}</a><button id="menu" aria-expanded="false" aria-controls="nav">${t.menu} ☰</button><nav id="nav" aria-label="${t.menu}">${t.nav.slice(1).map((x,i)=>`<a href="${url(slugs[i+1])}" ${page===slugs[i+1]?'aria-current="page"':''}>${x}</a>`).join('')}</nav><span class="ev-future" title="${r?'Появится позже':'Atsiras vėliau'}" aria-disabled="true">♙ ${r?'Личный кабинет · Скоро':'Asmeninis kambarys · Netrukus'}</span><div class="languages">${['ru','lt'].map(l=>`<a lang="${l}" href="${url(page,detail,l)}" ${lang===l?'aria-current="true"':''}>${l.toUpperCase()}</a>`).join('<span> | </span>')}</div></header><main id="content">${page?`<section class="page-heading"><span class="eyebrow">EMOTIONVIBES</span><h1>${title}</h1></section><section class="section page-body">${body}</section>`:body}</main><footer><div><a class="brand" href="${url()}">EmotionVibes</a><p>${t.tagline}</p></div><a href="${url('privacy')}">${t.privacy}</a><span class="preview">${t.preview}</span></footer>`;}
function activate(lang){const menu=document.querySelector('#menu');menu?.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(open));document.querySelector('#nav').classList.toggle('open',open)});const filter=()=>{let count=0;const term=(document.querySelector('#search')?.value||'').trim().toLocaleLowerCase(lang),cat=document.querySelector('#category')?.value;document.querySelectorAll('[data-search]').forEach(el=>{el.hidden=!(el.dataset.search.includes(term)&&(!cat||el.dataset.category===cat));if(!el.hidden)count++});const empty=document.querySelector('#empty');if(empty)empty.hidden=count>0};document.querySelector('#search')?.addEventListener('input',filter);document.querySelector('#category')?.addEventListener('change',filter);document.querySelector('#share')?.addEventListener('click',async e=>{try{await navigator.clipboard.writeText(location.href);e.target.textContent=site[lang].copied}catch{window.prompt(site[lang].share,location.href)}});document.querySelectorAll('.load-video').forEach(b=>b.addEventListener('click',()=>{const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.video;f.title=b.closest('article').querySelector('h3').textContent;f.allow='fullscreen; picture-in-picture';f.referrerPolicy='strict-origin-when-cross-origin';f.setAttribute('allowfullscreen','');b.parentNode.replaceChildren(f)}));document.querySelector('#disable-video')?.addEventListener('click',()=>{document.querySelectorAll('iframe').forEach(f=>f.remove());location.reload()});}

function openPage(){const [lang0,page="",detail=""]=location.hash.slice(2).split("/");const lang=["ru","lt"].includes(lang0)?lang0:"ru";document.documentElement.lang=lang;document.body.innerHTML=render(lang,page,detail,true);document.title="EmotionVibes · "+(site[lang].nav[slugs.indexOf(page)]||site[lang].privacy);activate(lang);window.scrollTo(0,0)}window.addEventListener("hashchange",openPage);openPage();</script></body></html>
