function activate(lang){const groups=[...document.querySelectorAll('.ev-nav-group')];const closeGroups=except=>groups.forEach(g=>{if(g!==except)g.open=false});groups.forEach(g=>{g.addEventListener('toggle',()=>{if(g.open)closeGroups(g)});g.addEventListener('mouseleave',e=>{if(!window.matchMedia('(hover: hover) and (pointer: fine)').matches)return;clearTimeout(g._leaveTimer);g._leaveTimer=setTimeout(()=>{if(!g.matches(':hover'))g.open=false},650)});g.addEventListener('mouseenter',()=>clearTimeout(g._leaveTimer));g.querySelector('.ev-nav-dropdown')?.addEventListener('pointerenter',()=>clearTimeout(g._leaveTimer))});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.ev-nav-group'))closeGroups()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeGroups();document.activeElement?.blur?.()}});const menu=document.querySelector('#menu');menu?.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(open));document.querySelector('#nav').classList.toggle('open',open)});let activeTopic='';const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase(lang);const filter=()=>{let count=0;const term=normalize(document.querySelector('#search')?.value.trim()),cat=document.querySelector('#category')?.value;document.querySelectorAll('[data-search]').forEach(el=>{el.hidden=!(normalize(el.dataset.search).includes(term)&&(!cat||el.dataset.category===cat)&&(!activeTopic||(el.dataset.topics||'').split(' ').includes(activeTopic)));if(!el.hidden)count++});const empty=document.querySelector('#empty');if(empty)empty.hidden=count>0;const status=document.querySelector('#result-count');if(status)status.textContent=(lang==='ru'?'Найдено вопросов: ':'Rasta klausimų: ')+count};document.querySelectorAll('.topic-chip').forEach(b=>b.addEventListener('click',()=>{activeTopic=b.dataset.topic;document.querySelectorAll('.topic-chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));filter()}));document.querySelector('#search')?.addEventListener('input',filter);document.querySelector('#category')?.addEventListener('change',filter);document.querySelector('#reset-filters')?.addEventListener('click',()=>{activeTopic='';document.querySelectorAll('.topic-chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.topic==='')));const search=document.querySelector('#search'),category=document.querySelector('#category');if(search)search.value='';if(category)category.value='';filter()});filter();document.querySelector('#share')?.addEventListener('click',async e=>{try{await navigator.clipboard.writeText(location.href);e.target.textContent=site[lang].copied}catch{window.prompt(site[lang].share,location.href)}});document.querySelectorAll('.load-video').forEach(b=>b.addEventListener('click',()=>{const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.video;f.title=b.closest('article').querySelector('h3').textContent;f.allow='fullscreen; picture-in-picture';f.referrerPolicy='strict-origin-when-cross-origin';f.setAttribute('allowfullscreen','');b.parentNode.replaceChildren(f)}));document.querySelector('#disable-video')?.addEventListener('click',()=>{document.querySelectorAll('iframe').forEach(f=>f.remove());location.reload()});}
