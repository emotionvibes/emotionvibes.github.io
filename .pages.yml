    label: Grojaraščio HTTPS nuoroda
    type: string
  - name: category
    label: Kategorija
    type: string
  - name: date
    label: Data (YYYY-MM-DD)
    type: string
  - *id001
  - *id002
- name: meditations
  label: Meditacijos
