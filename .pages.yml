media:
  input: public/images
  output: /images
content:
- name: questions
  label: Klausimai ir atsakymai
  type: file
  path: src/data/questions.json
  format: json
  list: true
  fields:
  - name: slug
    label: Unikalus adresas (pvz., apie-prota)
    type: string
    required: true
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    description: "Tik mažosios lotyniškos raidės, skaičiai ir brūkšneliai. Vienam klausimui unikalus, vėliau nekeisti."
  - name: category
    label: Pagrindinė kategorija (0 Buvimas, 1 Meditacija, 2 Santykiai)
    type: number
    description: "0 = Присутствие / Buvimas, 1 = Медитация / Meditacija, 2 = Отношения / Santykiai"
  - name: topics
    label: Temos (galima pasirinkti kelias)
    type: select
    options:
      multiple: true
      values:
      - name: mind
        label: Protas / Ум
      - name: heart
        label: Širdis / Сердце
      - name: sleep
        label: Miegas / Сон
      - name: meditation
        label: Meditacija / Медитация
      - name: relationships
        label: Santykiai / Отношения
      - name: emotions
        label: Emocijos / Эмоции
    description: "Pasirinkite vieną arba kelias temas. Svetainės lankytojai matys jas pasirinkta kalba."
  - name: demo
    label: Pavyzdinis turinys
    type: boolean
  - &id001
    name: ru
    label: RU
    type: object
    fields:
    - name: title
      label: Pavadinimas
      type: string
    - name: body
      label: Tekstas
      type: text
  - &id002
    name: lt
    label: LT
    type: object
    fields:
    - name: title
      label: Pavadinimas
      type: string
    - name: body
      label: Tekstas
      type: text
- name: thoughts
  label: Mano mintys
  type: file
  path: src/data/thoughts.json
  format: json
  list: true
  fields:
  - name: slug
    label: Unikalus adresas
    type: string
  - name: date
    label: Data (YYYY-MM-DD)
    type: string
  - name: category
    label: Temos numeris
    type: number
  - name: demo
    label: Pavyzdinis turinys
    type: boolean
  - *id001
  - *id002
- name: music
  label: Muzika ir grojaraščiai
  type: file
  path: src/data/music.json
  format: json
  list: true
  fields:
